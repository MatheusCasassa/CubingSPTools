<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CSPTools (CubingSP Tools): ferramentas para Delegados, Organizadores e competidores da WCA — ScoreComps (súmulas em PDF), CubeStaff (grupos e staff) e Calcumulative (limite cumulativo e média)." />
    <meta name="theme-color" content="#0b0c10" />
    <title>CSPTools — CubingSP Tools</title>
    <script>
      // Aplica o tema salvo antes do render (evita flash). Padrão: escuro.
      try {
        var t = localStorage.getItem('ferramentas.theme')
        document.documentElement.classList.toggle('dark', t !== 'light')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
